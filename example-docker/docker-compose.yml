# ローカルで動作確認するための最小 WordPress 環境（任意）
#   docker compose up -d  →  http://localhost:8080  で初期セットアップ
#   プラグイン「Questetra Trigger Form (Reference)」を有効化し、固定ページに [qtf_form] を貼る
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      # リポジトリ直下のプラグインをマウント
      - ../questetra-trigger-form:/var/www/html/wp-content/plugins/questetra-trigger-form
volumes:
  db_data:
  wp_data:
